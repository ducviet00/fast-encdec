[workspace]
authors = ["ducviet00 <vietyb00@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
# Build the Python extension module the engine loads (fastencdec/layers/mojo_attn.py).
build = "mojo build src/fastencdec_mojo_attn.mojo --emit shared-lib -o build/fastencdec_mojo_attn.so"
# Standalone kernel test (no torch, no Python): layout, tail masking, online softmax.
test = "mojo run -I src tests/test_attention.mojo"

[dependencies]
max = ">=26.7.0.dev2026102005,<27"
mojo = ">=1.2.0.dev2026102005,<2"

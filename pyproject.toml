[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-encdec"
version = "0.1.0"
description = "Tiny CPU BART/Florence-2 inference: paged KV cache, continuous batching, beam search"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "Pillow"]

[tool.setuptools.packages.find]
include = ["fastencdec*"]

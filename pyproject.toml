[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-encdec"
version = "0.1.0"
description = "Tiny BART/Florence-2 inference: paged KV cache, continuous batching, beam search"
requires-python = ">=3.10"
dependencies = ["transformers", "Pillow"]

[project.optional-dependencies]
cpu = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  # The CPU attention kernels; without them the engine silently falls back to
  # the slow SDPA path.
  "cpu-attention",
]
cu130 = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "flash-attn>=2.7",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
cpu-attention = { git = "https://github.com/ducviet00/cpu-attention.git" }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

# Both kernels build against (and link) the torch the project runs with.
[tool.uv.extra-build-dependencies]
cpu-attention = [{ requirement = "torch", match-runtime = true }]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
include = ["fastencdec*"]
